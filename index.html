<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparring Partner</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <main>
    <header>
      <h1>Sparring Partner</h1>
      <p id="status">Press start, allow the camera, then step back until your upper body is in view.</p>
    </header>

    <div id="stage">
      <canvas id="ring"></canvas>
      <div id="you">
        <video id="camera" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="flash"></div>
      <div id="score" hidden></div>
    </div>

    <div id="controls">
      <button id="start" type="button">Start camera</button>
      <label id="level-label" hidden>Level
        <select id="level">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <button id="spar" type="button" hidden>Start sparring</button>
      <label id="callouts" hidden><input id="voice" type="checkbox" checked> Call out my moves</label>
      <span id="readout"></span>
    </div>

    <details id="tools" hidden>
      <summary>Tuning tools</summary>
      <div id="tool-buttons">
        <button id="body" type="button">Body recording (80 seconds)</button>
        <button id="punches" type="button">Punch recording (65 seconds)</button>
        <button id="guided" type="button">Guided recording (75 seconds)</button>
        <button id="record" type="button">Free recording (15 seconds)</button>
      </div>
    </details>

    <p id="moves" aria-live="off"></p>
    <p id="debug"></p>
    <p id="version">Version 16</p>
  </main>

  <script type="module" src="src/main.js?v=16"></script>
</body>
</html>
