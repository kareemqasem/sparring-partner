<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparring Partner</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main>
    <header>
      <h1>Sparring Partner</h1>
      <p id="status">Press start, allow the camera, then step back until your upper body is in view.</p>
    </header>

    <div id="stage">
      <video id="camera" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="flash"></div>
    </div>

    <div id="controls">
      <button id="start" type="button">Start camera</button>
      <button id="guided" type="button" hidden>Guided recording (75 seconds)</button>
      <button id="record" type="button" hidden>Free recording (15 seconds)</button>
      <span id="readout"></span>
    </div>

    <p id="moves" aria-live="off"></p>
    <p id="debug"></p>
    <p id="version">Version 6</p>
  </main>

  <script type="module" src="src/main.js?v=6"></script>
</body>
</html>
