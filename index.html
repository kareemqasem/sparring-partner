<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Code of War</title>
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <main>
    <header>
      <h1>The Code of War</h1>
      <p id="status">Press start, allow the camera, then step back until your upper body is in view.</p>
    </header>

    <div id="stage">
      <canvas id="ring"></canvas>
      <div id="you">
        <video id="camera" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="flash"></div>
      <div id="score" hidden></div>

      <div id="results" hidden>
        <h2 id="results-title">Round over</h2>
        <p id="results-detail"></p>
        <dl id="results-list"></dl>
        <div id="results-buttons">
          <button id="replay-open" type="button">3D replay</button>
          <button id="again" type="button" class="quiet">Go again</button>
          <button id="close-results" type="button" class="quiet">Close</button>
        </div>
      </div>

      <div id="replay" hidden>
        <canvas id="replay-canvas" width="1280" height="720"></canvas>
        <div id="replay-bar">
          <button id="replay-full" type="button" class="quiet">Full round</button>
          <button id="replay-highlight" type="button" class="quiet">Highlight</button>
          <button id="replay-save" type="button">Save as video</button>
          <button id="replay-close" type="button" class="quiet">Close</button>
        </div>
        <p id="replay-status"></p>
      </div>
    </div>

    <div id="controls">
      <button id="start" type="button">Start camera</button>
      <label class="pick" id="mode-label" hidden>Mode
        <select id="mode">
          <option value="spar">Sparring</option>
          <option value="defense">Defense</option>
        </select>
      </label>
      <label class="pick" id="level-label" hidden>Level
        <select id="level">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label class="pick" id="length-label" hidden>Round
        <select id="length">
          <option value="1">1 minute</option>
          <option value="2">2 minutes</option>
          <option value="3" selected>3 minutes</option>
        </select>
      </label>
      <button id="spar" type="button" hidden>Start round</button>
      <label id="callouts" hidden><input id="voice" type="checkbox" checked> Call out my moves</label>
      <span id="readout"></span>
    </div>

    <details id="tools" hidden>
      <summary>Tuning tools</summary>
      <div id="tool-buttons">
        <button id="body" type="button">Body recording (80 seconds)</button>
        <button id="punches" type="button">Punch recording (65 seconds)</button>
        <button id="guided" type="button">Guided recording (75 seconds)</button>
        <button id="record" type="button">Free recording (15 seconds)</button>
      </div>
    </details>

    <p id="moves" aria-live="off"></p>
    <p id="debug"></p>
    <p id="version">Version 19</p>
  </main>

  <script type="module" src="src/main.js?v=19"></script>
</body>
</html>
